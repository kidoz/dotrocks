name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore DotRocks.slnx --locked-mode

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build DotRocks.slnx --configuration Release --no-restore

      # Integration suites (Data.IntegrationTests, Data.DapperTests, EntityFrameworkCore.IntegrationTests)
      # require a live StarRocks server and run in integration.yml. Run only the server-free
      # unit/protocol/analyzer/packaging suites here.
      - name: Test
        run: |
          dotnet test tests/DotRocks.Protocol.Tests --configuration Release --no-build
          dotnet test tests/DotRocks.EntityFrameworkCore.Tests --configuration Release --no-build
          dotnet test tests/DotRocks.Analyzers.Tests --configuration Release --no-build
          dotnet test tests/DotRocks.Benchmarks.Tests --configuration Release --no-build
          dotnet test tests/DotRocks.PackageTests --configuration Release --no-build

  # The budget-gated benchmarks are server-free but take minutes, so they run beside the build
  # job rather than extending it. Without this the catalog in PerformanceBudget.cs is only ever
  # enforced when a developer remembers to run `just bench`, so a read-path allocation or
  # latency regression could land unnoticed.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore DotRocks.slnx --locked-mode

      # Allocation budgets only: allocation is byte-identical across machines, while mean times
      # are not (the same benchmark measures ~43.8 us on a dev machine and ~111.6 us here), so
      # gating on wall clock would fail on runner speed rather than on a real regression. Local
      # `just bench` still enforces both. Exit code 1 means an allocation budget was exceeded, a
      # budgeted benchmark has no catalog entry, or nothing was measured.
      - name: Run budgeted benchmarks
        env:
          DOTROCKS_BENCHMARK_ALLOCATION_ONLY: 1
        run: >
          dotnet run --project benchmarks/DotRocks.Benchmarks --configuration Release
          -- --anyCategories Local
